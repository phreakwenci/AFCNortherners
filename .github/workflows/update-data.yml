name: Update site data

on:
  schedule:
    # Times are UTC. Game windows (Thu night, Sun, Mon night): every 30 min.
    - cron: "*/30 0-6 * * 1,2,5"     # Thu/Sun/Mon night games (UTC rolls past midnight)
    - cron: "*/30 17-23 * * 0"       # Sunday afternoon/evening
    - cron: "17 13 * * *"            # Daily catch-up
    # Transcripts: Tuesday show ends ~3am UTC Wed; captions take a few hours.
    - cron: "41 8,13,18 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standings, schedule, scores, draft order
        run: python scripts/fetch_nfl.py
      - name: Show transcripts
        continue-on-error: true
        run: |
          pip install --quiet "youtube-transcript-api>=1.0,<2"
          python scripts/fetch_transcripts.py
      - name: Commit changes
        run: |
          git config user.name "afc-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data transcripts
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

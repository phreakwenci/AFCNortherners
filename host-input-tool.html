<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Host Entry Tool - AFC Northerners</title>
    <script src="draft-order-2026.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #eee; padding: 40px; }
        .card { background: #1a1a1a; border-radius: 8px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .grid-header { display: grid; grid-template-columns: 80px 100px 1fr 1fr 1fr 1fr; gap: 15px; font-weight: bold; padding: 10px; border-bottom: 2px solid #333; position: sticky; top: 0; background: #1a1a1a; }
        .pick-row { display: grid; grid-template-columns: 80px 100px 1fr 1fr 1fr 1fr; gap: 15px; padding: 10px; border-bottom: 1px solid #222; align-items: center; }
        input { background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; width: 90%; }
        input:focus { border-color: #d50a0a; outline: none; }
        .controls { margin-top: 30px; border-top: 2px solid #333; padding-top: 20px; }
        textarea { width: 100%; height: 150px; background: #000; color: #00ff00; font-family: monospace; padding: 10px; margin-top: 10px; }
        .btn { background: #d50a0a; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-alt { background: #333; margin-left: 10px; }
        .filter-box { margin-bottom: 20px; padding: 10px; width: 300px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Host Prediction Generator</h1>
        <p>Enter predictions. Search for your team (e.g., "CLE") to find specific picks. Picks auto-save to this browser.</p>

        <input type="text" id="filter" class="filter-box" placeholder="Search by Team (CLE, PIT, etc)..." onkeyup="filterPicks()">

        <div class="grid-header">
            <div>Pick</div><div>Team</div><div>Dave</div><div>Chris</div><div>Rob</div><div>Jan</div>
        </div>
        <div id="editor-container"></div>

        <div class="controls">
            <button class="btn" onclick="savePicks()">SAVE PICKS</button>
            <button class="btn btn-alt" onclick="generateCode()">COPY AS JS FILE</button>
            <span id="save-status" style="margin-left: 15px; color: #888; font-size: 0.9em;"></span>
            <textarea id="output" readonly placeholder="Click COPY AS JS FILE to generate host-picks-2026.js content for committing to the repo..." style="display:none"></textarea>
        </div>
    </div>

    <script>
        const HOST_PICKS_KEY = 'afcn_host_picks_2026';
        const container = document.getElementById('editor-container');
        const order = window.DRAFT_ORDER_2026 || [];
        let saveTimer = null;

        function init() {
            order.forEach(pick => {
                const row = document.createElement('div');
                row.className = 'pick-row';
                row.dataset.team = pick.team;
                row.innerHTML = `
                    <div>#${pick.overall}</div>
                    <div style="font-weight:bold; color:#ff3c00">${pick.team}</div>
                    <input type="text" class="p-input" data-pick="${pick.overall}" data-host="Dave" oninput="scheduleSave()">
                    <input type="text" class="p-input" data-pick="${pick.overall}" data-host="Chris" oninput="scheduleSave()">
                    <input type="text" class="p-input" data-pick="${pick.overall}" data-host="Rob" oninput="scheduleSave()">
                    <input type="text" class="p-input" data-pick="${pick.overall}" data-host="Jan" oninput="scheduleSave()">
                `;
                container.appendChild(row);
            });
            loadSavedPicks();
        }

        function filterPicks() {
            const q = document.getElementById('filter').value.toUpperCase();
            document.querySelectorAll('.pick-row').forEach(row => {
                row.style.display = row.dataset.team.includes(q) ? 'grid' : 'none';
            });
        }

        function collectPicks() {
            const picks = {};
            document.querySelectorAll('.p-input').forEach(input => {
                const val = input.value.trim();
                if (val) {
                    const id = 'pick-' + input.dataset.pick;
                    if (!picks[id]) picks[id] = {};
                    picks[id][input.dataset.host] = val;
                }
            });
            return picks;
        }

        function loadSavedPicks() {
            try {
                const saved = localStorage.getItem(HOST_PICKS_KEY);
                if (!saved) return;
                const data = JSON.parse(saved);
                const picks = data.picks || {};
                document.querySelectorAll('.p-input').forEach(input => {
                    const id = 'pick-' + input.dataset.pick;
                    const host = input.dataset.host;
                    if (picks[id] && picks[id][host]) {
                        input.value = picks[id][host];
                    }
                });
                const status = document.getElementById('save-status');
                if (data.savedAt) {
                    status.textContent = 'Last saved: ' + new Date(data.savedAt).toLocaleString();
                }
            } catch (e) {
                console.error('Error loading picks:', e);
            }
        }

        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(savePicks, 800);
        }

        function savePicks() {
            const picks = collectPicks();
            const data = { picks, savedAt: new Date().toISOString(), version: 'v1' };
            localStorage.setItem(HOST_PICKS_KEY, JSON.stringify(data));

            const status = document.getElementById('save-status');
            status.textContent = 'Saved at ' + new Date().toLocaleTimeString();
            status.style.color = '#00ff00';
            setTimeout(() => { status.style.color = '#888'; }, 3000);
        }

        // Fallback: generate host-picks-2026.js content so picks can be committed to the repo
        function generateCode() {
            const picks = collectPicks();
            const output = `// OFFICIAL 2026 HOST PREDICTIONS - AFC Northerners\n// Generated by host-input-tool.html\n\nwindow.HOST_PICKS_2026_VERSION = 'v1-${Date.now()}';\n\nwindow.HOST_PICKS_2026 = ${JSON.stringify(picks, null, 4)};`;
            const ta = document.getElementById('output');
            ta.style.display = 'block';
            ta.value = output;
            ta.select();
        }

        init();
    </script>
</body>
</html>
